# ===============================
# = GLOBAL CONFIG
# ===============================
spring.application.name=${SPRING_APP_NAME:DIP_SPRING_SECURITY}
server.port=${SERVER_PORT:8090}
#spring.security.user.name=${SECURITY_USERNAME:jonathan}
#spring.security.user.password=${SECURITY_PASSWORD:1234}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/springsecurity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWD:d1p10m4d0j4v4}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
# Keep the connection alive if idle for a long time (needed in production)
# spring.datasource.testWhileIdle=true
# spring.datasource.validationQuery=SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=${SPRING_SHOW_SQL:true}
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=${SPRING_DDL_AUTO:none}
# Allows Hibernate to generate SQL optimized for a particular DBMS
#spring.jpa.properties.hibernate.dialect=${SPRING_DDL_DIALECT:org.hibernate.dialect.MariaDBDialect}
# Allows Hibernate to format SQL in console
spring.jpa.properties.hibernate.format_sql=${SPRING_FORMAT_SQL:true}